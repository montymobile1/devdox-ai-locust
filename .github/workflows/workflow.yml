name: "Swagger Test Generator"
description: "Generate Locust tests from a Swagger/OpenAPI URL"
on: [push]

permissions:
  contents: write

jobs:
  swagger-gen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate Locust tests
        uses: montymobile1/devdox-ai-locust@0.1.6.1
        with:
          swagger_url: "https://petstore3.swagger.io/api/v3/openapi.json"
          output: "/github/workspace/generated_tests"
          users: "15"
          spawn_rate: "3"
          run_time: "10m"
          together_api_key: ${{ secrets.TOGETHER_API_KEY }}

      - name: Upload generated tests as artifact
        uses: actions/upload-artifact@v4
        with:
          name: generated-locust-tests
          path: generated_tests/
